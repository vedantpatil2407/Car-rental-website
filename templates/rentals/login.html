{% extends 'base.html' %}
{% block title %}Owner Portal Login &bull; {{ BUSINESS_NAME }}{% endblock %}

{% block content %}
<section class="section" style="padding: 70px 0; min-height: 75vh; display: flex; align-items: center; justify-content: center;">
  <div class="container" style="max-width: 460px; margin: 0 auto; width: 100%;">
    <div class="glass-card" style="padding: 36px 30px; border-radius: 16px; border: 1px solid var(--color-border); box-shadow: 0 16px 40px rgba(0,0,0,0.6); background: rgba(19, 27, 44, 0.9);">
      <div style="text-align: center; margin-bottom: 24px;">
        <div style="width: 56px; height: 56px; border-radius: 50%; background: rgba(0, 210, 255, 0.12); color: var(--color-primary); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 14px; border: 1px solid rgba(0, 210, 255, 0.35);">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
        <h1 style="font-size: 1.5rem; font-weight: 700; color: #FFFFFF; margin-bottom: 6px;">Owner Portal Login</h1>
        <p style="color: var(--color-text-secondary); font-size: 0.9rem;">Sign in to manage bookings, fleet pricing & availability</p>
      </div>

      <form method="POST" action="{% url 'owner_login' %}{% if next %}?next={{ next }}{% endif %}" style="display: flex; flex-direction: column; gap: 16px;">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">

        <div>
          <label style="display: block; font-size: 0.84rem; font-weight: 600; color: #E2E8F0; margin-bottom: 6px;">Username</label>
          <input type="text" name="username" required autofocus placeholder="Enter owner username (e.g. owner or admin)" class="form-input" style="width: 100%;">
        </div>

        <div>
          <label style="display: block; font-size: 0.84rem; font-weight: 600; color: #E2E8F0; margin-bottom: 6px;">Password</label>
          <input type="password" name="password" required placeholder="Enter password" class="form-input" style="width: 100%;">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 12px; font-weight: 600; margin-top: 8px; font-size: 1rem;">
          Sign In to Owner Portal →
        </button>
      </form>

      <div style="margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--color-border); text-align: center; display: flex; flex-direction: column; gap: 8px;">
        <span style="font-size: 0.82rem; color: var(--color-text-muted);">
          Looking for customer booking status? <a href="{% url 'booking_lookup' %}" style="color: var(--color-primary-light); text-decoration: none; font-weight: 600;">Track Booking</a>
        </span>
        <a href="{% url 'home' %}" style="color: var(--color-text-secondary); font-size: 0.82rem; text-decoration: none; margin-top: 4px;">← Back to Home</a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
